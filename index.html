function navMarkup(mobile=false){return [['home','home','總覽'],['itinerary','route','行程'],['places','pin','景點'],['budget','wallet','記帳'],['tools','bag','工具']].map(([v,i,l])=>`<button class="${mobile?'':'navbtn '} ${view===v?'active':''}" data-action="navigate" data-view="${v}" ${view===v?'aria-current="page"':''}>${icon(i)}<span>${l}</span></button>`).join('');}
function setView(v,scroll=true){view=v;query='';filter='all';render();if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function render(){document.getElementById('desktop-nav').innerHTML=navMarkup();document.getElementById('mobile-nav').innerHTML=navMarkup(true);document.getElementById('view').innerHTML=({home:homeView,itinerary:itineraryView,places:placesView,budget:budgetView,tools:toolsView}[view])();updateStorage();document.getElementById('view-name').textContent={home:'旅程總覽',itinerary:'每日行程',places:'景點收藏',budget:'旅行記帳',tools:'旅人工具'}[view];}
function intro(label,title,desc,btn=''){return `<div class="intro"><div><p class="eyebrow gold">${label}</p><h1>${title}</h1><p>${desc}</p></div>${btn}</div>`;}
function countdown(){const tokyo=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const dates=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const o=Object.fromEntries(dates.map(p=>[p.type,p.value]));const today=Date.UTC(+o.year,+o.month-1,+o.day);const diff=Math.round((Date.UTC(2026,11,4)-today)/86400000);return diff>0?`<b>${diff}</b> 天後，出發大阪`:diff>=-3?`<b>DAY ${1-diff}</b> 大阪旅行中`:'<b>OUR MEMORIES</b> 旅程已結束';}
function flightCard(back=false){return `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow gold">${back?'RETURN FLIGHT':'DEPARTURE FLIGHT'}</span><span class="badge">${back?'12/7 MON':'12/4 FRI'} · ${back?'CI173':'CI152'}</span></div><div class="flightline"><div class="flightplace"><div class="routecode">${back?'KIX':'TPE'}</div><small>${back?'關西 T1':'桃園 T2'}</small><b>${back?'19:00':'09:45'}</b></div><div class="flightmid">${icon('plane')}</div><div class="flightplace"><div class="routecode">${back?'TPE':'KIX'}</div><small>${back?'桃園 T2':'關西 T1'}</small><b>${back?'21:25':'13:20'}</b></div></div><p class="subtext">中華航空 · 各機場當地時間${back?' · 目標 16:00 抵達關西機場':' · 日本比台灣快 1 小時'}</p></div>`;}
function homeView(){const done=state.checklist.filter(x=>x.done).length;return `${intro('A LITTLE ESCAPE / DECEMBER','下一站，大阪。','四天三夜，把時間留給喜歡的地方。',`<button class="iconbtn" data-action="print" aria-label="列印完整行程">${icon('print')}</button>`)}<section class="hero"><div class="hero-art">${svgArt(0,true)}</div><div class="hero-copy"><p class="eyebrow gold">JAPAN · 2026 WINTER JOURNEY</p><h2 class="serif">OSAKA<span>大阪，慢慢逛。</span></h2><p>在神社許一個願，穿過熱鬧的街角。<br>這一次，吃好、逛好，也好好休息。</p><div class="countdown">${countdown()}</div><button class="button gold" data-action="navigate" data-view="itinerary" style="margin-top:20px">打開我的行程 ${icon('arrow')}</button></div><div class="hero-stamp">道頓堀夜色 / ORIGINAL ILLUSTRATION</div></section><div class="stats">${[['calendar','12.04 — 12.07','2026 / 四天三夜'],['heart','2 位成人','一起出發'],['hotel','相鐵 FRESA INN','大阪難波站前 / 已決定'],['route','3 座神社','購物、美食與參拜']].map(([i,v,t])=>`<div class="stat"><span class="symbol">${icon(i)}</span><div><strong>${v}</strong><small>${t}</small></div></div>`).join('')}</div><div class="section-head"><h2>四天，四種大阪</h2><button class="textbtn" data-action="navigate" data-view="itinerary">查看行程 ${icon('arrow')}</button></div><div class="daygrid">${DAYS.map((d,i)=>`<button class="daycard" data-action="open-day" data-day="${d.id}"><div class="miniart">${svgArt(i)}<span class="daynum">DAY 0${d.id}</span></div><div class="daybody"><span class="eyebrow gold">DEC ${4+i} / ${['FRI','SAT','SUN','MON'][i]}</span><h3>${['道頓堀的第一晚','門真購物日','神社與梅田','堀江的慢步調'][i]}</h3><p>${d.subtitle}</p><div class="dayfoot"><span>${allEvents(d.id).length} 個安排 · ${d.label} 週${d.weekday}</span>${icon('chevron')}</div></div></button>`).join('')}</div>${bookingPanel()}<div class="section-head"><h2>旅途的重要小事</h2><button class="textbtn" data-action="navigate" data-view="tools">旅行工具 ${icon('arrow')}</button></div><div class="twocol">${flightCard()}<div class="panel"><span class="eyebrow gold">YOUR HOME IN OSAKA</span><div class="hotelrow" style="margin-top:18px"><div class="hotelglyph">${icon('hotel')}</div><div><div class="hoteltitle">相鐵 FRESA INN<br>大阪難波站前</div><span class="badge warm">住宿已決定</span></div></div><p class="subtext">12/4 入住 — 12/7 退房 · 共 3 晚<br>兩位成人／一間房；房型與費用依最終訂單確認</p><div class="actions">${ext(map('Sotetsu Fresa Inn Osaka-Namba'),icon('pin')+' 飯店地圖')}${ext('https://sotetsu-hotels.com/fresa-inn/namba-ekimae/','官方網站 ↗')}</div></div></div><div class="section-head"><h2>準備好，就出發</h2><span class="counter">${done} / ${state.checklist.length} 已完成</span></div><div class="panel"><div class="progress"><i style="width:${state.checklist.length?done/state.checklist.length*100:0}%"></i></div><p class="subtext" style="margin:12px 0">會員卡、交通、上網與行李，在這裡一次確認。</p><button class="textbtn" data-action="navigate" data-view="tools">打開準備清單 ${icon('arrow')}</button></div>${footnote()}`;}
const homeViewCore=homeView;
homeView=function(){return homeViewCore().replace(`<div class="twocol">${flightCard()}`,`<div class="twocol">${flightCard()}${flightCard(true)}`).replace('<div class="panel"><span class="eyebrow gold">YOUR HOME IN OSAKA</span>','<div class="panel" style="grid-column:1/-1"><span class="eyebrow gold">YOUR HOME IN OSAKA</span>');};
function footnote(){return `<p class="footnote">行程時間為規劃估計，班機依你提供的截圖整理；出發前請確認列車、店家與神社公告。<br>資料更新：2026.10.02 · 住宿已更新為相鐵 FRESA INN 大阪難波站前 · 首頁已補上回程航班 · 餐廳尚未訂位 · 海遊館與天保山為備選 · 你的勾選、記帳與筆記只儲存在此瀏覽器。</p>`;}
function itineraryView(){const d=DAYS[day-1];return `${intro('YOUR DAILY JOURNEY','每日行程','不趕路，也不錯過想去的地方。',`<button class="button light" data-action="add-event">${icon('plus')} 加入安排</button>`)}<div class="daytabs">${DAYS.map(d=>`<button class="daytab ${d.id===day?'active':''}" data-action="day" data-day="${d.id}" aria-pressed="${d.id===day}"><b>${d.label}</b> <small>週${d.weekday}</small><span>DAY 0${d.id} · ${['抵達','購物','參拜','返程'][d.id-1]}</span></button>`).join('')}</div><div class="day-banner"><div class="bigday">0${d.id}</div><div><p class="eyebrow gold">${d.subtitle}</p><h2>${d.title}</h2><p>2026 年 12 月 ${3+d.id} 日 · 日本時間（去程起飛／桃園早餐除外） · ${allEvents(day).filter(e=>state.done.includes(e.id)).length} / ${allEvents(day).length} 已完成</p></div></div>${mealSummary()}<div class="toolbar"><div class="searchbox">${icon('search')}<input id="event-search" aria-label="搜尋當日行程" placeholder="搜尋這一天的行程…" value="${esc(query)}"></div>${[['all','全部'],['spot','景點'],['shop','購物'],['food','美食'],['transit','交通']].map(([v,l])=>`<button class="chip ${filter===v?'active':''}" data-action="filter" data-filter="${v}" aria-pressed="${filter===v}">${l}</button>`).join('')}</div><div class="itinerary-layout"><div id="event-list" class="timeline">${eventList()}</div><aside class="stickyaside"><div class="panel"><p class="eyebrow gold">ROUTE NOTES</p><h3 style="margin-top:8px">今天怎麼走</h3><p>${esc(d.note)}</p></div><div class="panel"><p class="eyebrow gold">QUICK ACCESS</p><div class="mini-list">${ext(direction('Sotetsu Fresa Inn Osaka-Namba'),icon('hotel')+' 回飯店路線','')}${ext('https://www.nankai.co.jp/',icon('train')+' 南海電鐵官網','')}<button class="textbtn" data-action="navigate" data-view="budget">${icon('wallet')} 記下一筆花費</button></div></div></aside></div>${footnote()}`;}
function bookingPanel(){return `<section class="panel bookingpanel"><div class="section-head" style="margin:0 0 12px"><div><p class="eyebrow gold">DINING RESERVATION</p><h2>先把這一餐留好</h2></div><span class="badge warm">尚未訂位</span></div><h3>はり重 道頓堀本店・壽喜燒</h3><p>目標用餐：<strong>12/5（六）18:30 · 2 位成人</strong><br>雪方案參考 ¥9,900／人，兩人 ¥19,800；飲品、加點與最終費用依訂位確認。</p><div class="bookingnotice"><strong>10/5 早上，再查看訂位</strong><p>10/1 實際查詢：官方日曆最晚可選 12/1，12/5 尚不可選。10/5 是建議重新查看日期，並非店家公告開放日。已另於 ChatGPT 設定台灣時間當天早上的提醒。</p></div><div class="actions">${ext('https://booking.ebica.jp/webrsv/search/e014229301/36240','開啟官方訂位 ↗')}${ext('https://www.harijyu.co.jp/shop-info/2173/','店家與價格公告 ↗','textbtn')}</div><details class="details"><summary>訂位前需要準備什麼？</summary><p>選「道頓堀本店 日本料理」、12/5、18:30、大人 2 位、小孩 0 位。備妥姓名（含日文讀音）、聯絡電話與 Email，確認餐點、費用與取消條款。收到餐廳確認信才算訂位完成。店內沒有電梯，需走樓梯。</p><p>目前查得的雪套餐方案列有「當日未通知取消，收取 100%」；應以實際選用平台的完整規則為準。請將訂位編號記在私人備忘錄，勿寫進公開 HTML。</p></details><p class="subtext">福太郎與金澤まいもん壽司皆不接受訂位，已在當日行程預留候位彈性。本網頁不會自行送出訂位，也沒有背景推播。</p></section>`;}
function mealSummary(){const meals=allEvents(day).filter(x=>x.meal);return `<section class="panel meal-summary"><div class="section-head" style="margin:0 0 13px"><h2>今天吃什麼</h2><span class="badge warm">用餐計畫 · 未訂位</span></div><div class="mealgrid">${meals.map(e=>`<div class="mealmini"><span class="eyebrow gold">${esc(e.meal)} · ${esc(e.time)}</span><h3>${esc(e.title.split('｜')[1]||e.title)}</h3><p>${esc(e.budget)}</p>${e.reservationStatus?`<p class="reservation-status">${esc(e.reservationStatus)}</p>`:''}${e.booking?ext(e.booking,'官方訂位 ↗','textbtn'):e.source?ext(e.source,'店家資訊 ↗','textbtn'):''}</div>`).join('')}</div><p class="subtext">一般餐費為規劃預算；壽喜燒列已查到的12月適用方案供參考。實際以菜單及訂位確認為準，飲品與加點另計。</p></section>`;}
function eventList(){let events=allEvents(day).filter(e=>(filter==='all'||e.type===filter)&&(!query||(e.title+' '+e.description).toLowerCase().includes(query.toLowerCase())));if(!events.length)return '<div class="empty">沒有符合的行程，試試其他分類或關鍵字。</div>';return events.map(e=>{const done=state.done.includes(e.id),custom=state.custom.some(x=>x.id===e.id);return `<article class="event"><div class="eventtime">${esc(e.time)}</div><div class="eventcard ${done?'done':''}"><div class="eventtop"><div><span class="type">${types[e.type][0]}${custom?' · 自訂':''}</span><h3>${esc(e.title)}</h3></div><button class="iconbtn" data-action="done" data-id="${e.id}" aria-label="${done?'取消完成':'標記完成'}：${esc(e.title)}" aria-pressed="${done}">${icon(done?'check':'plus')}</button></div><p>${esc(e.description)}</p>${e.budget?`<p class="mealprice">${esc(e.budget)}</p>`:''}${e.reservationStatus?`<p class="reservation-status">${esc(e.reservationStatus)}</p>`:''}${state.notes[e.id]?`<p class="event-note">${esc(state.notes[e.id])}</p>`:''}<div class="eventactions">${e.place?ext(direction(e.place),icon('pin')+' 路線導航',''):''}${e.source?ext(e.source,'店家資訊 ↗',''):''}${e.booking?ext(e.booking,'官方訂位 ↗',''):''}${e.priceSource?ext(e.priceSource,'方案價格 ↗',''):''}${e.reviewSource?ext(e.reviewSource,'人氣／食記 ↗',''):''}<button data-action="event-note" data-id="${e.id}">${icon('note')} 備註</button>${custom?`<button data-action="delete-event" data-id="${e.id}">${icon('trash')} 移除</button>`:''}</div></div></article>`;}).join('');}
function placesView(){return `${intro('PLACES TO REMEMBER','想去的地方','把喜歡的地方收好，出門時一鍵導航。')}<div class="toolbar"><div class="searchbox">${icon('search')}<input id="place-search" aria-label="搜尋景點" placeholder="搜尋景點或區域…" value="${esc(placeQuery)}"></div>${[['all','全部'],['shrine','神社'],['shop','購物'],['food','美食'],['backup','備選'],['favorites','我的收藏']].map(([v,l])=>`<button class="chip ${placeFilter===v?'active':''}" data-action="place-filter" data-filter="${v}">${l}</button>`).join('')}</div><div id="place-list" class="placegrid">${placeList()}</div>${footnote()}`;}
function placeList(){const list=PLACES.filter(p=>(placeFilter==='all'||placeFilter===p.category||(placeFilter==='favorites'&&state.favorites.includes(p.id)))&&(!placeQuery||(p.name+p.area).toLowerCase().includes(placeQuery.toLowerCase())));if(!list.length)return '<div class="empty" style="grid-column:1/-1">這裡還沒有景點。點選景點右側的星星，就能加入收藏。</div>';return list.map(p=>`<article class="placecard"><div class="miniart">${svgArt(p.category==='shrine'?2:p.id==='orange'?3:p.category==='shop'?1:0)}<span class="daynum">${p.day?'DAY 0'+p.day:'OPTIONAL'}</span></div><div class="placebody"><div class="placetop"><span class="badge">${p.area} · ${p.type}</span><button class="iconbtn fav ${state.favorites.includes(p.id)?'active':''}" data-action="favorite" data-id="${p.id}" aria-label="收藏 ${p.name}" aria-pressed="${state.favorites.includes(p.id)}">${icon('star')}</button></div><h3 style="margin-top:11px">${p.name}</h3><p>${p.note}</p><div class="actions">${ext(direction(p.query),icon('pin')+' 導航')}${p.url?ext(p.url,'官網 ↗'):''}</div></div></article>`).join('');}
function budgetView(){const total=totalTWD(),remaining=state.budget-total,pct=state.budget?Math.min(100,total/state.budget*100):0;const cats=Object.entries(catNames).map(([id,name])=>({id,name,total:state.expenses.filter(x=>x.category===id).reduce((n,x)=>n+x.amount*(x.currency==='JPY'?state.rate:1),0)})).filter(x=>x.total>0);return `${intro('TRAVEL WALLET','旅行記帳','兩人共同支出，日圓與台幣一起整理。',`<button class="button" data-action="add-expense">${icon('plus')} 記一筆</button>`)}<div class="moneyhero"><div class="moneyflex"><div><span class="eyebrow" style="color:#b6c5ad">TOTAL SPENT / 已記錄支出</span><h2>NT$ ${money(total)}</h2><small>台幣金額＋日圓換算估值 · 非信用卡實際入帳</small></div><button class="button gold small" data-action="budget-settings">${icon('settings')} 設定</button></div><div class="progressrow"><span>預算 NT$ ${money(state.budget)}${state.budget===30000?'（可調整）':''}</span><span>${state.budget?Math.round(total/state.budget*100)+'%':'未設定'}</span></div><div class="progress" style="background:#426050"><i style="width:${pct}%;background:${remaining<0?'#e19270':'#e0bf7b'}"></i></div></div><div class="metricgrid"><div class="metric"><span>${remaining>=0?'剩餘預算':'超出預算'}</span><strong>NT$ ${money(Math.abs(remaining))}</strong></div><div class="metric"><span>每人平均 / 2 人</span><strong>NT$ ${money(total/2)}</strong></div><div class="metric"><span>手動匯率 / 1 JPY</span><strong>${state.rate} TWD</strong></div></div><p class="subtext">初始匯率 0.22 與預算 NT$30,000 是可修改的示例，並非即時匯率或實際旅費估算。調整匯率會重算所有日圓支出。</p><div class="twocol" style="margin-top:24px"><div class="panel"><div class="section-head" style="margin:0"><h2>支出明細</h2><span class="counter">${state.expenses.length} 筆</span></div>${state.expenses.length?state.expenses.slice().reverse().map(x=>`<div class="ledgerrow"><div class="catglyph">${icon(catIcons[x.category])}</div><div class="ledgerinfo"><strong>${esc(x.title)}</strong><small>${x.date} · ${catNames[x.category]}</small></div><div class="amount">${x.currency==='JPY'?'¥':'NT$'} ${money(x.amount)}${x.currency==='JPY'?`<small>約 NT$ ${money(x.amount*state.rate)}</small>`:''}</div><button class="iconbtn" data-action="delete-expense" data-id="${x.id}" aria-label="刪除 ${esc(x.title)}">${icon('trash')}</button></div>`).join(''):'<div class="empty">還沒有花費紀錄。<br>買完東西，按「記一筆」就能保存。</div>'}</div><div><div class="panel"><h3>錢花在哪裡</h3>${cats.length?`<div class="barchart">${cats.map(x=>`<div><div class="barlabel"><span>${x.name}</span><span>NT$ ${money(x.total)}</span></div><div class="progress"><i style="width:${x.total/total*100}%"></i></div></div>`).join('')}</div>`:'<p class="subtext">新增支出後，會依餐飲、購物、交通等分類呈現。</p>'}</div><div class="panel" style="margin-top:18px"><p class="eyebrow gold">QUICK CONVERTER</p><h3 style="margin-top:8px">看到價格，快速換算</h3><div class="converter"><label class="field">日圓 JPY<input type="number" id="convert-jpy" min="0" max="1000000000" inputmode="decimal" placeholder="輸入金額"></label><span style="padding-bottom:10px">→</span><label class="field">約台幣 TWD<output id="convert-twd">0</output></label></div><p class="subtext">使用你設定的匯率 ${state.rate}。</p></div></div></div>${footnote()}`;}
function checklistRows(){return state.checklist.map(c=>`<div class="checkrow ${c.done?'checked':''}"><label><input type="checkbox" data-check="${c.id}" ${c.done?'checked':''}>${esc(c.text)}</label>${c.custom?`<button class="iconbtn" data-action="delete-check" data-id="${c.id}" aria-label="刪除 ${esc(c.text)}">${icon('trash')}</button>`:''}</div>`).join('');}
function shopRows(){return state.shopping.length?state.shopping.map(s=>`<div class="shoprow ${s.done?'checked':''}"><label><input type="checkbox" data-shop="${s.id}" ${s.done?'checked':''}><span>${esc(s.text)}${s.store?`<small style="display:block">${esc(s.store)}</small>`:''}</span></label><button class="iconbtn" data-action="delete-shop" data-id="${s.id}" aria-label="刪除 ${esc(s.text)}">${icon('trash')}</button></div>`).join(''):'<div class="empty">把想買的東西加入清單。<br>Costco、Outlet、梅田，都不漏買。</div>';}
function toolsView(){const n=state.checklist.filter(x=>x.done).length;return `${intro('EVERYTHING IN YOUR POCKET','旅人工具','清單、票程與靈感，隨身帶著走。')}${bookingPanel()}<div class="toolsgrid"><section class="panel"><div class="section-head" style="margin:0 0 12px"><h2>行前準備</h2><span id="check-counter" class="counter">${n} / ${state.checklist.length}</span></div><div id="check-rows">${checklistRows()}</div><form id="check-form" class="inlineform"><input name="text" maxlength="200" placeholder="還需要帶什麼？" aria-label="新增準備事項" required><button class="button small" type="submit" aria-label="新增準備事項">${icon('plus')}</button></form></section><section class="panel"><div class="section-head" style="margin:0 0 12px"><h2>購物願望清單</h2><button class="textbtn" data-action="add-shop">${icon('plus')} 新增</button></div><div id="shop-rows">${shopRows()}</div></section><section class="panel"><p class="eyebrow gold">LITTLE THINGS TO REMEMBER</p><h2 style="font-size:20px;margin-top:7px">旅行備忘錄</h2><textarea id="memo" class="notepad" maxlength="20000" placeholder="想吃的餐廳、想找的品牌、旅途中突然想到的事…" aria-label="旅行備忘錄">${esc(state.memo)}</textarea><p class="subtext" id="memo-status">輸入後自動儲存在此瀏覽器。</p></section><section class="panel"><p class="eyebrow gold">YOUR DATA, YOUR JOURNEY</p><h2 style="font-size:20px;margin-top:7px">備份與隨身使用</h2><div class="toolrow"><div><strong>匯出備份</strong><small>保存清單、筆記、記帳與自訂行程</small></div><button class="iconbtn" data-action="export" aria-label="匯出備份">${icon('download')}</button></div><div class="toolrow"><div><strong>匯入備份</strong><small>在另一台裝置還原，會取代目前資料</small></div><button class="iconbtn" data-action="import" aria-label="匯入備份">${icon('upload')}</button></div><div class="toolrow"><div><strong>列印完整行程</strong><small>也可選擇另存為 PDF</small></div><button class="iconbtn" data-action="print" aria-label="列印完整行程">${icon('print')}</button></div><details class="details"><summary>加到手機主畫面</summary><p>iPhone：用 Safari 開啟 GitHub Pages 網址，按分享，再選「加入主畫面」。Android：用 Chrome 開啟網址，在選單尋找「加到主畫面」。選項依瀏覽器版本略有不同。</p></details><details class="details"><summary>離線使用與資料儲存</summary><p>下載 index.html 後可離線閱讀；GitHub 網頁本身沒有離線快取保證。地圖與官網需要網路。資料存在此瀏覽器，無雲端同步；清除瀏覽資料會刪除你的紀錄。換手機時請匯出、再匯入備份。</p></details><p class="subtext">網站更新保留相同網址時，通常會延續此瀏覽器的 App 資料。行程頁上的示意插畫不是實景照片。</p></section></div><div class="section-head"><h2>班機與住宿資料</h2></div><div class="twocol">${flightCard()}${flightCard(true)}</div><section class="panel" style="margin-top:20px"><div class="section-head" style="margin:0"><h2>相鐵 FRESA INN 大阪難波站前</h2><span class="badge warm">住宿已決定</span></div><p class="subtext">入住 12/4 → 退房 12/7，兩位成人／一間房，三晚。房型、價格與付款狀態依最終訂單為準。</p><div class="toolrow"><div><strong>飯店地址</strong><small>〒556-0011 大阪府大阪市浪速区難波中1丁目6-5</small></div><button class="iconbtn" data-action="copy" data-value="〒556-0011 大阪府大阪市浪速区難波中1丁目6-5 相鉄フレッサイン大阪なんば駅前" aria-label="複製飯店地址">${icon('copy')}</button></div><div class="toolrow"><div><strong>交通位置</strong><small>大阪 Metro 難波站 7 號出口附近／南海難波站步行可達</small></div><button class="iconbtn" data-action="copy" data-value="Sotetsu Fresa Inn Osaka-Namba" aria-label="複製飯店英文名稱">${icon('copy')}</button></div><div class="actions">${ext('https://sotetsu-hotels.com/fresa-inn/namba-ekimae/','飯店官網 ↗')}${ext(map('Sotetsu Fresa Inn Osaka-Namba'),'飯店地圖 ↗')}${ext('https://mitsui-shopping-park.com/lalaport/kadoma/access/train.html','門真接駁車資訊 ↗')}</div></section>${footnote()}`;}
function openModal(title,body,submitLabel,onSubmit){modalSubmit=onSubmit;const d=document.getElementById('modal');d.innerHTML=`<div class="dialoghead"><h2 id="modal-title">${title}</h2><button class="iconbtn" type="button" data-action="close-modal" aria-label="關閉視窗">${icon('close')}</button></div><form id="modal-form">${body}<div class="dialogactions"><button class="button light" type="button" data-action="close-modal">取消</button><button class="button" type="submit">${submitLabel}</button></div></form>`;d.showModal();}
function closeModal(){document.getElementById('modal').close();modalSubmit=null;}
function confirmAction(title,message,fn){openModal(title,`<p class="dialogtext">${esc(message)}</p>`,'確認',()=>{fn();closeModal();});}
function eventModal(){openModal('加入自己的安排',`<div class="formgrid"><label class="field">日期<select name="day">${DAYS.map(d=>`<option value="${d.id}" ${day===d.id?'selected':''}>${d.label} 週${d.weekday}</option>`).join('')}</select></label><label class="field">時間<input name="time" type="time" value="12:00" required></label><label class="field full">名稱<input name="title" placeholder="例如：堀江咖啡店" maxlength="100" required></label><label class="field full">地點（用於地圖搜尋）<input name="place" maxlength="200" placeholder="店名＋大阪，或詳細地址"></label><label class="field">分類<select name="type">${Object.entries(types).map(([v,[l]])=>`<option value="${v}">${l}</option>`).join('')}</select></label><label class="field full">備註<textarea name="description" maxlength="2000" placeholder="預約、想買的東西、交通提醒…"></textarea></label></div>`,'加入行程',fd=>{const title=fd.get('title').trim();if(!title)return toast('請輸入行程名稱');state.custom.push({id:'custom-'+uid(),day:+fd.get('day'),time:fd.get('time'),title,place:fd.get('place').trim(),description:fd.get('description').trim(),type:fd.get('type')});day=+fd.get('day');save();closeModal();render();toast('已加入行程');});}
function expenseModal(){openModal('記下一筆花費',`<div class="formgrid"><label class="field full">項目<input name="title" maxlength="100" required placeholder="例如：Costco 伴手禮"></label><label class="field">金額<input name="amount" type="number" inputmode="decimal" min="0.01" max="1000000000" step="0.01" required placeholder="0"></label><label class="field">幣別<select name="currency"><option value="JPY">日圓 JPY</option><option value="TWD">台幣 TWD</option></select></label><label class="field">分類<select name="category">${Object.entries(catNames).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></label><label class="field">日期<input type="date" name="date" value="${DAYS[day-1].date}" required></label></div><p class="subtext">記錄兩人共同支出；台幣換算使用手動匯率 ${state.rate}。</p>`,'儲存花費',fd=>{const title=fd.get('title').trim(),amount=+fd.get('amount');if(!title||!Number.isFinite(amount)||amount<=0)return toast('請填寫項目與有效金額');state.expenses.push({id:uid(),title,amount,currency:fd.get('currency'),category:fd.get('category'),date:fd.get('date')});save();closeModal();render();toast('花費已記錄');});}
function settingsModal(){openModal('預算與換算設定',`<div class="formgrid"><label class="field full">兩人總預算（TWD）<input type="number" name="budget" min="0" max="1000000000" step="1" value="${state.budget}" required></label><label class="field full">1 日圓＝多少台幣<input type="number" name="rate" inputmode="decimal" min="0.000001" max="10" step="0.000001" value="${state.rate}" required><small>手動填入你的換匯成本或想使用的估算匯率；不是即時報價。</small></label></div>`,'儲存設定',fd=>{state.rate=+fd.get('rate');state.budget=+fd.get('budget');save();closeModal();render();toast('已更新換算與預算');});}
function shopModal(){openModal('加入購物清單',`<div class="formgrid"><label class="field full">想買什麼？<input name="text" maxlength="200" required placeholder="例如：伴手禮、球鞋"></label><label class="field full">在哪裡找？<input name="store" maxlength="100" placeholder="例如：Costco / 梅田 / 橘子街"></label></div>`,'加入清單',fd=>{const text=fd.get('text').trim();if(!text)return toast('請輸入商品名稱');state.shopping.push({id:uid(),text,store:fd.get('store').trim(),done:false});save();closeModal();render();toast('已加入購物清單');});}
function exportData(){const blob=new Blob([JSON.stringify({app:'osaka-studio-2026',exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='osaka-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('備份已下載，可在其他裝置匯入');}
function printAll(){document.getElementById('print-content').innerHTML=`<h1>大阪四日旅程 · 2026.12.04–12.07</h1><p>2 位成人 · 相鐵 FRESA INN 大阪難波站前（住宿已決定）</p><p>CI152：12/4 TPE T2 09:45 → KIX T1 13:20<br>CI173：12/7 KIX T1 19:00 → TPE T2 21:25（各機場當地時間）</p>${DAYS.map(d=>`<section class="printday"><h2>${d.label} 週${d.weekday} · ${d.subtitle}</h2>${allEvents(d.id).map(e=>`<article><b>${esc(e.time)}　${esc(e.title)}</b><p>${esc(e.description)}</p>${e.budget?`<p class="mealprice">${esc(e.budget)}</p>`:''}${state.notes[e.id]?`<p>備註：${esc(state.notes[e.id])}</p>`:''}</article>`).join('')}<p style="margin-top:12px">交通：${esc(d.note)}</p></section>`).join('')}`;window.print();}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('地址已複製');}catch(e){openModal('複製地址',`<p class="dialogtext">請選取下方地址複製。</p><textarea readonly aria-label="地址">${esc(text)}</textarea>`,'完成',()=>closeModal());}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
 if(a==='navigate')return setView(b.dataset.view);
 if(a==='open-day'){day=+b.dataset.day;return setView('itinerary');}
 if(a==='day'){day=+b.dataset.day;query='';filter='all';return render();}
 if(a==='filter'){filter=b.dataset.filter;return render();}
 if(a==='place-filter'){placeFilter=b.dataset.filter;return render();}
 if(a==='done'){state.done=state.done.includes(id)?state.done.filter(x=>x!==id):[...state.done,id];save();return render();}
 if(a==='favorite'){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();document.getElementById('place-list').innerHTML=placeList();return;}
 if(a==='event-note'){const ev=allEvents(day).find(x=>x.id===id);return openModal('行程備註',`<p class="dialogtext">${esc(ev.title)}</p><label class="field">備註<textarea name="note" maxlength="2000">${esc(state.notes[id]||'')}</textarea></label>`,'儲存',fd=>{state.notes[id]=fd.get('note').trim();save();closeModal();render();toast('備註已儲存');});}
 if(a==='delete-event')return confirmAction('移除這個安排？','只會移除你新增的安排，原始行程會保留。',()=>{state.custom=state.custom.filter(x=>x.id!==id);state.done=state.done.filter(x=>x!==id);delete state.notes[id];save();render();toast('已移除');});
 if(a==='add-event')return eventModal();if(a==='add-expense')return expenseModal();if(a==='budget-settings')return settingsModal();if(a==='add-shop')return shopModal();
 if(a==='delete-expense')return confirmAction('刪除這筆花費？','刪除後，總額與分類統計會重新計算。',()=>{state.expenses=state.expenses.filter(x=>x.id!==id);save();render();toast('花費已刪除');});
 if(a==='delete-shop')return confirmAction('移除購物項目？','確認從購物清單移除這個項目。',()=>{state.shopping=state.shopping.filter(x=>x.id!==id);save();render();});
 if(a==='delete-check')return confirmAction('移除準備事項？','確認移除這個自訂準備事項。',()=>{state.checklist=state.checklist.filter(x=>x.id!==id);save();render();});
 if(a==='close-modal')return closeModal();if(a==='export')return exportData();if(a==='import')return document.getElementById('import-file').click();if(a==='print')return printAll();if(a==='copy')return copy(b.dataset.value);
});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='event-search'){query=t.value;document.getElementById('event-list').innerHTML=eventList();}if(t.id==='place-search'){placeQuery=t.value;document.getElementById('place-list').innerHTML=placeList();}if(t.id==='memo'){state.memo=t.value;save();document.getElementById('memo-status').textContent=storageIssue?'未能儲存，請匯出備份。':'已儲存在此瀏覽器 ✓';}if(t.id==='convert-jpy'){const n=+t.value;document.getElementById('convert-twd').textContent=Number.isFinite(n)&&n>=0?money(n*state.rate):'—';}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.check){state.checklist.find(x=>x.id===t.dataset.check).done=t.checked;save();document.getElementById('check-rows').innerHTML=checklistRows();document.getElementById('check-counter').textContent=state.checklist.filter(x=>x.done).length+' / '+state.checklist.length;}if(t.dataset.shop){state.shopping.find(x=>x.id===t.dataset.shop).done=t.checked;save();document.getElementById('shop-rows').innerHTML=shopRows();}});
document.addEventListener('submit',e=>{if(e.target.id==='modal-form'){e.preventDefault();if(e.target.reportValidity()&&modalSubmit)modalSubmit(new FormData(e.target));}if(e.target.id==='check-form'){e.preventDefault();const text=new FormData(e.target).get('text').trim();if(!text)return;state.checklist.push({id:uid(),text,done:false,custom:true});save();render();toast('準備事項已加入');}});
document.getElementById('import-file').addEventListener('change',async e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;if(file.size>2500000)return toast('檔案過大，請使用 App 匯出的 JSON 備份');try{const raw=JSON.parse(await file.text());if(raw.app!=='osaka-studio-2026')throw Error('不是此 App 的備份檔');const validated=validate(raw.data);confirmAction('匯入這份備份？',`包含 ${validated.expenses.length} 筆花費、${validated.shopping.length} 個購物項目與 ${validated.custom.length} 個自訂安排。會取代此裝置目前資料；建議先匯出現有備份。`,()=>{state=validated;save();render();toast('備份已還原');});}catch(err){toast('匯入失敗：'+err.message);}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget){const r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
render();
</script></body></html>
